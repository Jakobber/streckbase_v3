[project]
name = "streckbase"
version = "0.1.0"
description = "Streckbase V3 — FastAPI/SQLModel backend for the workplace beverage purchase tracker"
readme = "README.md"
authors = [
    { name = "Jakobber", email = "jakob@svardby.se" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.1",
    "pymysql>=1.2.0",
    "sqlmodel>=0.0.38",
    "uvicorn[standard]>=0.49.0",
]

[project.scripts]
serve = "streckbase.main:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
